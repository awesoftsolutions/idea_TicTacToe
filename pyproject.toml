[tool.poetry]
name = "tictoe"
version = "0.1.0"
description = "Tic-Tac-Toe: Critter Clash"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.0.0"
pillow = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
